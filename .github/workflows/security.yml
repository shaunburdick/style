---
name: Security

on:
    push:
        branches: [main]  # Always scan merges to main (unfiltered) so code-scanning alert state stays current
    pull_request:
        # Deliberately unfiltered: "Security Scan" is a required status check for main,
        # and trigger-level path filters suppress the check entirely on docs-only PRs,
        # leaving it stuck at "Expected" and blocking merge forever. The ~60s scan runs
        # on every PR so the required check always reports a real conclusion.

# Workflow-wide least privilege: read-only unless a job explicitly elevates.
permissions:
    contents: read

jobs:
    security-scan:
        name: Security Scan
        runs-on: ubuntu-latest
        permissions:
            security-events: write
            contents: read
            actions: read

        steps:
            - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
            - name: Initialize CodeQL
              uses: github/codeql-action/init@1a818fd5f97ed0ee9a823421bd5b171add01227f  # v4.36.2
              with:
                  languages: javascript-typescript
            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@1a818fd5f97ed0ee9a823421bd5b171add01227f  # v4.36.2
