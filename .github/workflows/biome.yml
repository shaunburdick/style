---
name: Biome

on:
    push:
        branches: [main]  # Run on merge to main only (avoids duplicate runs with pull_request)
    pull_request:  # Run on all PRs (no branches filter = all branches)

# Workflow-wide least privilege: read-only unless a job explicitly elevates.
permissions:
    contents: read

jobs:
    test-biome:
        name: Test Biome Config
        runs-on: ubuntu-latest

        strategy:
            matrix:
                node-version: [22.x, 24.x, 26.x]
                # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

        steps:
            - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: "npm"
                  cache-dependency-path: biome/package-lock.json
            - run: npm ci
              working-directory: ./biome
            - run: npm run build --if-present
              working-directory: ./biome
            - run: npm test
              working-directory: ./biome

    dependency-check-biome:
        name: Biome Dependency Audit
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
            - name: Use Node.js 22.x
              uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
              with:
                  node-version: 22.x
                  cache: "npm"
                  cache-dependency-path: biome/package-lock.json
            - run: npm ci
              working-directory: ./biome
            - name: Run npm audit
              run: npm audit --audit-level=high
              working-directory: ./biome

    publish-biome:
        name: Publish Biome Config
        needs: [test-biome, dependency-check-biome]
        if: github.event_name == 'push' && github.ref_name == 'main'  # This condition limits the job to pushes to the main branch
        runs-on: ubuntu-latest
        permissions:
            id-token: write  # Required for OIDC
            contents: write  # Required to create releases

        steps:
            - uses: actions/checkout@9f698171ed81b15d1823a05fc7211befd50c8ae0  # v6.0.3
            - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e  # v6.4.0
              with:
                  node-version: 22
                  registry-url: 'https://registry.npmjs.org'
            - name: Update npm
              run: npm install -g npm@latest
            - run: npm ci
              working-directory: ./biome
            - name: Get package version
              id: package-version
              run: echo "version=$(node -p "require('./package.json').version")" >> $GITHUB_OUTPUT
              working-directory: ./biome
            - name: Check if version exists on NPM
              id: version-check
              run: |
                if npm view biome-config-shaunburdick@${{ steps.package-version.outputs.version }} version 2>/dev/null; then
                  echo "exists=true" >> $GITHUB_OUTPUT
                else
                  echo "exists=false" >> $GITHUB_OUTPUT
                fi
              working-directory: ./biome
            - name: Publish to NPM
              if: steps.version-check.outputs.exists == 'false'
              run: |
                if [[ "${{ steps.package-version.outputs.version }}" == *"beta"* ]]; then
                  npm publish --tag beta --provenance --access public
                else
                  npm publish --provenance --access public
                fi
              working-directory: ./biome
            - name: Publish status
              if: steps.version-check.outputs.exists == 'false'
              run: |
                echo "Published version ${{ steps.package-version.outputs.version }} to NPM"
            - name: Create GitHub Release
              if: steps.version-check.outputs.exists == 'false'
              uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
              with:
                  tag_name: biome-v${{ steps.package-version.outputs.version }}
                  name: biome-v${{ steps.package-version.outputs.version }}
                  generate_release_notes: true
